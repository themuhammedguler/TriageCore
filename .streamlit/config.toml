# ==============================================================================
# TriageCore - Streamlit Kuresel Konfigurasyon ve Tema Ayarlari
# ==============================================================================
# Bu dosya, Streamlit'in varsayilan temasini kurumsal klinik Dark Mode'a kilitler;
# boylece istemci isletim sistemi ne olursa olsun beyaz parlama veya kontrast
# kaybi yasanmaz.
# ==============================================================================

[theme]
# Temel koyu tema sablonu aktif edilir
base = "dark"
# Kurumsal klinik camgobegi vurgu rengi (Medical Sky Cyan)
primaryColor = "#0EA5E9"
# Derin obsidiyen arka plan rengi
backgroundColor = "#0B0F19"
# Kenar cubugu ve kart panelleri icin ikincil koyu zemin
secondaryBackgroundColor = "#0F172A"
# Yuksek okunurluk saglayan temiz beyaz metin rengi
textColor = "#F8FAFC"
# Okunabilirlik icin temiz modern tirnaksiz yazi tipi
font = "sans serif"

[server]
# Sunucunun tarayiciyi otomatik acmadan arka planda baslamasi saglanir
headless = true
# Streamlit varsayilan yerel sunucu portu
port = 8501

[browser]
# Anonim kullanim istatistikleri toplamasi tamamen kapatilir
gatherUsageStats = false
